name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'packaging/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a draft release with the DMG'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"', Path('proxy/__init__.py').read_text()).group(1)
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and app version must match'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - name: Prepare universal2 Python
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m venv .venv
          echo "BUILD_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Install universal2 dependencies
        run: bash scripts/prepare_universal2.sh
      - name: Run tests
        run: '"$BUILD_PYTHON" -m unittest discover -s tests -v'
      - name: Build and validate DMG
        env:
          TG_WS_TARGET_ARCH: universal2
        run: bash scripts/build_macos.sh
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v7
        with:
          name: TgWsProxyMac-${{ steps.version.outputs.version }}-universal2
          path: |
            dist/TgWsProxyMac_universal2.dmg
            dist/TgWsProxyMac_universal2.dmg.sha256
          if-no-files-found: error

  draft-release:
    needs: build-macos
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TgWsProxyMac-${{ needs.build-macos.outputs.version }}-universal2
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-macos.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TG WS Proxy Mac ${{ needs.build-macos.outputs.version }}
          draft: true
          body: |
            macOS build for Apple Silicon and Intel (universal2).
            Drag TG WS Proxy Mac.app into Applications, launch it, then choose «Открыть в Telegram» from the menu bar.
            This build is ad-hoc signed and has not been notarized by Apple.
          files: |
            dist/TgWsProxyMac_universal2.dmg
            dist/TgWsProxyMac_universal2.dmg.sha256
          fail_on_unmatched_files: true
